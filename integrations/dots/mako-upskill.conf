# chezmoi target: append to ~/.config/mako/config (mako has no include directory).
# The daemon checks `makoctl mode` for do-not-disturb itself, so this section
# does not need to know about your DND mode.
[app-name=upskill]
default-timeout=25000
max-visible=1
group-by=app-name
# top, not overlay: never draw over fullscreen windows (meetings, video)
layer=top
on-button-left=invoke-action start
on-button-middle=invoke-action done
on-button-right=invoke-action snooze
