# chezmoi target: e.g. ~/.config/tmux/upskill.conf, then add to tmux.conf:
#   source-file -q ~/.config/tmux/upskill.conf

# Ambient status segment (no display-message flashes). Appends to status-right.
set -ag status-right ' #(cat ~/.cache/upskill/status 2>/dev/null)'

# prefix + U: jump to the upskill window, or open it with a practice-only
# kubeconfig (never the work one) and TUTOR=1.
bind-key U run-shell 'tmux select-window -t upskill 2>/dev/null || tmux new-window -n upskill -c "$HOME/upskill" -e "KUBECONFIG=$HOME/upskill/local/kube/practice.yaml" -e TUTOR=1 "claude /pause"'
